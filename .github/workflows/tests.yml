name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/cache@v4
      with:
        path: |
          .spago
          output
          node_modules
        key: build-atrifacts-v1-${{ hashFiles('package-lock.json', 'spago.yaml') }}
    - uses: actions/setup-node@v1
      with:
        node-version: 22
    - run: npm i
    - run: npm test
